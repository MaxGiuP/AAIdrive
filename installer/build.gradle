plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'io.github.maxgiup.aaidrive.setup'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.maxgiup.aaidrive.setup'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '0.1.0-' + providers.exec {
            commandLine 'git', 'rev-parse', '--short=7', 'HEAD'
        }.standardOutput.asText.get().trim()
    }
    buildFeatures { buildConfig true }
    buildTypes {
        release {
            minifyEnabled true
            debuggable false
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/bundledAssets')
    // APKs are already compressed; storing them avoids a costly second decompression on setup.
    androidResources { noCompress += 'apk' }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = '1.8' }
    testOptions { unitTests.includeAndroidResources = true }
}

// Bundle the APKs from this build, never stale previously published fork binaries.
def bundleApps = tasks.register('bundleApps', Exec) {
    dependsOn ':app:assembleNomapNonalyticsFullOptimized', ':screen-mirror:assembleRelease'
    workingDir rootProject.projectDir
    commandLine 'python3', 'scripts/prepare-setup-assets.py',
        layout.buildDirectory.dir('generated/bundledAssets').get().asFile.absolutePath
    inputs.files(rootProject.fileTree('app/build/outputs/apk/nomapNonalyticsFull/optimized') {
        include '*.apk', 'output-metadata.json'
    })
    inputs.files(rootProject.fileTree('screen-mirror/build/outputs/apk/release') {
        include '*.apk', 'output-metadata.json'
    })
    inputs.file rootProject.file('apk/Open-Headunit-v3.4.0-beta1.apk')
    inputs.dir rootProject.file('third-party/open-headunit')
    inputs.file rootProject.file('scripts/prepare-setup-assets.py')
    inputs.file rootProject.file('scripts/package-apk.py')
    inputs.file rootProject.file('docs/one-apk-setup.md')
    inputs.file rootProject.file('LICENSE')
    inputs.file rootProject.file('screen-mirror/NOTICE.md')
    outputs.dir layout.buildDirectory.dir('generated/bundledAssets')
}
tasks.named('preBuild').configure { dependsOn bundleApps }

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'org.mockito:mockito-core:5.18.0'
    testImplementation 'org.json:json:20240303'
}
